# Dedicated configuration for the 1.72 GiB lifecycle benchmark. The campaign
# uses a separate gateway socket/cache and this ownership label, so recovery
# cannot adopt sandboxes belonging to another gateway.

daemon:
  server:
    socket_path: /eos/runtime/daemon/runtime.sock
    pid_path: /eos/runtime/daemon/runtime.pid
    worker_threads: 4
    max_blocking_threads: 8
    blocking_thread_keep_alive_s: 5
    max_concurrent_connections: 64

runtime:
  workspace:
    layer_stack_root: /eos/layer-stack
    scratch_root: /eos/workspace
    setup_timeout_s: 30
    exit_grace_s: 0.25
    rfc1918_egress: allow
  namespace_execution:
    scratch_root: /eos/namespace_execution
    # Explicit user requirement: keep the frozen qualification profile armed.
    # The Docker provider retains CAP_SYS_ADMIN in the sandbox daemon for real
    # OverlayFS mounts; ordinary user commands still receive the standard,
    # capability-dropped profile.
    command_security_profile: mpla_benchmark_qualification
  layerstack:
    rollout_mode: legacy
    autosquash_policies:
      squash_at_n_layers: 100
  command:
    max_active: 32
  mpla_storage_admin:
    profile: overlayfs_dac_override_qualification

runner:
  mount_mask:
    hidden_paths:
      - /eos/runtime

observability:
  resource_stats:
    enabled: true
    sample_interval_ms: 1000
    max_disk_bytes: 4194304

manager:
  docker:
    # Keep the Docker boundary non-privileged. The provider grants the daemon
    # SYS_ADMIN/NET_ADMIN/SETPCAP, including SYS_ADMIN for OverlayFS mounting.
    privileged: false
    daemon_binary_path: dist/sandbox-daemon-linux-arm64
    daemon_config_yaml_path: config/materialization-lifecycle-benchmark.yml
    platform: linux/arm64
    gateway_instance_id: materialization-lifecycle-benchmark-20260729
    resource_profile: build-heavy
    resource_profiles:
      standard:
        nano_cpus: 1000000000
        memory_high_bytes: 402653184
        memory_max_bytes: 536870912
        pids_max: 256
        daemon_runtime_profile: standard
        separate_workload_cgroup: true
      build-heavy:
        nano_cpus: 4000000000
        memory_high_bytes: 3221225472
        memory_max_bytes: 4294967296
        pids_max: 1024
        daemon_runtime_profile: build-heavy
        separate_workload_cgroup: true
    container_env:
      HTTP_PROXY: http://http.docker.internal:3128
      HTTPS_PROXY: http://http.docker.internal:3128
      NO_PROXY: localhost,127.0.0.1,::1
