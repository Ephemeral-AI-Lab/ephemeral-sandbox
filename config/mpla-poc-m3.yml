# Dedicated Stage 04.6 M3 physical-campaign configuration.
#
# M2 evidence is sealed under its original configuration. M3 must recover only
# its own Docker resources, so this configuration uses a dedicated gateway
# ownership label rather than the shared default.

daemon:
  server:
    socket_path: /eos/runtime/daemon/runtime.sock
    pid_path: /eos/runtime/daemon/runtime.pid
    worker_threads: 4
    max_blocking_threads: 8
    blocking_thread_keep_alive_s: 5
    max_concurrent_connections: 64

runtime:
  workspace:
    layer_stack_root: /eos/layer-stack
    scratch_root: /eos/workspace
    setup_timeout_s: 30
    exit_grace_s: 0.25
    rfc1918_egress: allow
  namespace_execution:
    scratch_root: /eos/namespace_execution
  layerstack:
    rollout_mode: legacy
    autosquash_policies:
      squash_at_n_layers: 100
  command:
    max_active: 32
  # This dedicated physical qualification fixes the single OverlayFS VFS
  # write/search check on its internally-created mode-000 work directory.
  # Production config retains the CAP_SYS_ADMIN-only default.
  mpla_storage_admin:
    profile: overlayfs_dac_override_qualification

runner:
  mount_mask:
    hidden_paths:
      - /eos/runtime

observability:
  resource_stats:
    enabled: true
    sample_interval_ms: 2000
    max_disk_bytes: 4194304

manager:
  docker:
    # MPLA storage administration creates and confines the daemon-owned
    # workload cgroup. This dedicated physical-validation gateway is trusted;
    # ordinary production sandboxes remain de-privileged in config/prd.yml.
    privileged: true
    daemon_binary_path: dist/sandbox-daemon-linux-arm64
    daemon_config_yaml_path: config/mpla-poc-m3.yml
    platform: linux/arm64
    gateway_instance_id: mpla-poc-m3
    # The MPLA storage-admin gate needs a writable managed workload cgroup.
    # Docker Desktop exposes the private cgroup namespace read-only, so this
    # trusted gateway intentionally inherits the host cgroup view.
    cgroup_namespace_mode: host
    resource_profile: build-heavy
    resource_profiles:
      standard:
        nano_cpus: 1000000000
        memory_high_bytes: 402653184
        memory_max_bytes: 536870912
        pids_max: 256
        daemon_runtime_profile: standard
        separate_workload_cgroup: true
      build-heavy:
        nano_cpus: 4000000000
        memory_high_bytes: 134217728
        memory_max_bytes: 134217729
        pids_max: 1024
        daemon_runtime_profile: build-heavy
        separate_workload_cgroup: true
    container_env:
      HTTP_PROXY: http://http.docker.internal:3128
      HTTPS_PROXY: http://http.docker.internal:3128
      NO_PROXY: localhost,127.0.0.1,::1
