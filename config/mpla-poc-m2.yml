# Dedicated Stage 04.6 M2 physical-campaign configuration.
#
# The sandbox remains manager-owned and de-privileged.  The build-heavy
# envelope selects the required four CPUs while Docker Desktop remains fixed
# at four GiB.  The manager-owned workload cgroup is the storage domain; the
# physical runner sets its high watermark to 96 MiB while its manager-issued
# hard limit remains 128 MiB.
#
# Production commands hide all of /eos.  This campaign needs the manager-owned
# layer-stack and workspace volumes as separate durable control/fixture mounts,
# so it hides only daemon runtime state.  The config is used only by the
# explicitly leased PoC campaign.

daemon:
  server:
    socket_path: /eos/runtime/daemon/runtime.sock
    pid_path: /eos/runtime/daemon/runtime.pid
    worker_threads: 4
    max_blocking_threads: 8
    blocking_thread_keep_alive_s: 5
    max_concurrent_connections: 64

runtime:
  workspace:
    layer_stack_root: /eos/layer-stack
    scratch_root: /eos/workspace
    setup_timeout_s: 30
    exit_grace_s: 0.25
    rfc1918_egress: allow
  namespace_execution:
    scratch_root: /eos/namespace_execution
  layerstack:
    rollout_mode: legacy
    autosquash_policies:
      squash_at_n_layers: 100
  command:
    max_active: 32

runner:
  mount_mask:
    hidden_paths:
      - /eos/runtime

observability:
  resource_stats:
    enabled: true
    sample_interval_ms: 2000
    max_disk_bytes: 4194304

manager:
  docker:
    privileged: false
    daemon_binary_path: dist/sandbox-daemon-linux-arm64
    daemon_config_yaml_path: config/mpla-poc-m2.yml
    platform: linux/arm64
    resource_profile: build-heavy
    resource_profiles:
      standard:
        nano_cpus: 1000000000
        memory_high_bytes: 402653184
        memory_max_bytes: 536870912
        pids_max: 256
        daemon_runtime_profile: standard
        separate_workload_cgroup: true
      build-heavy:
        nano_cpus: 4000000000
        memory_high_bytes: 134217728
        memory_max_bytes: 134217729
        pids_max: 1024
        daemon_runtime_profile: build-heavy
        separate_workload_cgroup: true
    container_env:
      HTTP_PROXY: http://http.docker.internal:3128
      HTTPS_PROXY: http://http.docker.internal:3128
      NO_PROXY: localhost,127.0.0.1,::1
