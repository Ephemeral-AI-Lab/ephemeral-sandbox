[package]
name = "sandbox-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]

[[bin]]
name = "sandbox-daemon"
path = "src/main.rs"

[dependencies]
sandbox-config.workspace = true
sandbox-operation-contract.workspace = true
sandbox-operation-catalog = { workspace = true, features = ["observability", "runtime"] }
sandbox-observability-telemetry.workspace = true
sandbox-observability-query.workspace = true
sandbox-runtime-namespace-process.workspace = true
sandbox-protocol.workspace = true
sandbox-runtime.workspace = true
anyhow.workspace = true
# preserve_order keeps incoming operation arguments in caller order while this
# crate still accepts raw JSON requests.
serde_json = { workspace = true, features = ["preserve_order"] }
serde.workspace = true
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
uuid.workspace = true
sha2.workspace = true
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-ctl = { workspace = true, optional = true }

[dev-dependencies]
sandbox-runtime-layerstack.workspace = true
sandbox-runtime-workspace.workspace = true
rustix = { workspace = true, features = ["pipe"] }

[lints]
workspace = true
